[project]
name = "solana-sniper-bot"
version = "0.1.0"
description = "Leak-free reverse engineering and backtesting for the Solana Sniper Bot Kaggle hackathon"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.3.2",
  "numpy>=2.2.0",
  "pandas>=2.3.0",
  "pyarrow>=20.0.0",
  "pyyaml>=6.0.2",
  "scikit-learn>=1.7.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.0",
  "ruff>=0.12.0",
]

[project.scripts]
solana-download-wallet = "solana_sniper.download_wallet:main"
solana-stream-core = "solana_sniper.stream_core:main"
solana-audit-wallet = "solana_sniper.audit_wallet:main"
solana-extract-positive = "solana_sniper.extract_deploy_features:main"
solana-entry-latency = "solana_sniper.entry_latency:main"
solana-stream-negatives = "solana_sniper.stream_negative_sample:main"
solana-run-baseline = "solana_sniper.baseline:main"
solana-run-boosting = "solana_sniper.boosting:main"
solana-build-creator-history = "solana_sniper.creator_history:main"
solana-run-creator-history = "solana_sniper.creator_history_experiment:main"
solana-run-creator-stability = "solana_sniper.creator_history_stability:main"
solana-run-feature-attribution = "solana_sniper.feature_attribution:main"
solana-run-deployment-outflow = "solana_sniper.deployment_outflow_proxy:main"
solana-download-candles = "solana_sniper.download_candles:main"
solana-audit-candles = "solana_sniper.audit_candles:main"
solana-audit-trades-metadata = "solana_sniper.audit_trades_metadata:main"
solana-download-trades = "solana_sniper.download_trades:main"
solana-audit-trades = "solana_sniper.audit_trades:main"
solana-build-entry-prices = "solana_sniper.entry_prices:main"
solana-run-replica-backtest = "solana_sniper.replica_backtest:main"
solana-run-outflow-replica = "solana_sniper.outflow_replica_backtest:main"
solana-run-outflow-position = "solana_sniper.outflow_position_backtest:main"
solana-run-position-backtest = "solana_sniper.position_backtest:main"
solana-run-competitor-pnl = "solana_sniper.competitor_pnl:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/solana_sniper"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
